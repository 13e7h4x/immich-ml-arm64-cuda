apiVersion: apps/v1
kind: Deployment
metadata:
  name: immich-ml-arm64-cuda
  labels:
    app.kubernetes.io/name: immich-ml-arm64-cuda
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: immich-ml-arm64-cuda
  template:
    metadata:
      labels:
        app.kubernetes.io/name: immich-ml-arm64-cuda
    spec:
      runtimeClassName: nvidia
      containers:
        - name: machine-learning
          image: ghcr.io/OWNER/immich-ml-arm64-cuda:v3.3.5
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3003
          env:
            - name: MACHINE_LEARNING_CACHE_FOLDER
              value: /cache
            - name: MACHINE_LEARNING_MODEL_TTL
              value: "300"
          resources:
            requests:
              cpu: "250m"
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 8Gi
              nvidia.com/gpu: 1
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: immich-ml-cache
---
apiVersion: v1
kind: Service
metadata:
  name: immich-ml-arm64-cuda
spec:
  selector:
    app.kubernetes.io/name: immich-ml-arm64-cuda
  ports:
    - name: http
      port: 3003
      targetPort: http
