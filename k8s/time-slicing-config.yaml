apiVersion: v1
kind: ConfigMap
metadata:
  name: nvidia-device-plugin-time-slicing
  namespace: nvidia-gpu-operator
data:
  any: |
    version: v1
    flags:
      migStrategy: none
    sharing:
      timeSlicing:
        renameByDefault: false
        failRequestsGreaterThanOne: true
        resources:
          - name: nvidia.com/gpu
            replicas: 4
